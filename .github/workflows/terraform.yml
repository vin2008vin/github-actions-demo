name: terraform automation to create s3 bucket

on:
 pull_request:
   branches:
    - main
 push:    
   paths: 
    - 'main.tf'
  
 workflow_dispatch:
 
 

permissions:
 id-token: write
 contents: write

jobs:
  terraform_s3_builb:
   runs-on: ubuntu-latest

   steps:
     - name: checkout repository
       uses: actions/checkout@v4
       with:
         fetch-depth: 0

     - name: configure the aws credentials
       uses: aws-actions/configure-aws-credentials@v4.1.0
       with:
         role-to-assume: ${{secrets.oidc_token_github}}
         aws-regions: ap-south-1
         

     - name: initialise project and view terraform plann
       run: |
        cd terraform
        terraform fmt
        terraform init


        
         


  

  

  

 


   
