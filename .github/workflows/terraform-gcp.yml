name: 'terraform'

on:
 push:
  branches: [ "master" ]
 pull_request:
   
permissions: 
 id-token: 'write'
 contents: read

jobs:
  terraform:
   name: 'terraform'
   runs-on: ubuntu-latest

   defaults:
     run:
       shell: bash

    
   steps:
      - name: checkout
        uses: actions/checkout@v3

      - id: auth
        uses: google-github-actions/auth@v2.0.0
        with:
         workload_identity_provider: 'projects/553071091343/locations/global/workloadIdentityPools/github-action-pool/providers/github-actions'
         service_account: 'github-actions-wif-sa@project-b6ac39af-845d-4183-94e.iam.gserviceaccount.com'

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v1  

      - name: Terraform Init
        run: terraform init
  
  
      # Generates an execution plan for Terraform
      - name: Terraform Plan
        run: terraform plan -input=false
  
  
      - name: Terraform Apply
        run: terraform apply -auto-approve -input=false


         
 
          

   
